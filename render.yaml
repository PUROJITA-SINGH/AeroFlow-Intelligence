services:

  - type: web
    name: aeroflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: sh /app/prestart.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aeroflow-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://aeroflow-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_ISSUER
        value: aeroflow-api
      - key: JWT_AUDIENCE
        value: aeroflow-client
      - key: RUN_BACKGROUND_WORKERS
        value: "false"
      - key: RUN_PREDICTIONS_ON_STARTUP
        value: "false"
      - key: ML_DIR
        value: /app/ML_Models
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "300"

  - type: web
    name: aeroflow-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Frontend/aeroflow-ui/Dockerfile
    dockerContext: ./Frontend/aeroflow-ui
    envVars:
      - key: VITE_API_URL
        value: https://aeroflow-api.onrender.com

databases:
  - name: aeroflow-postgres
    databaseName: airport_analytics
    plan: free
