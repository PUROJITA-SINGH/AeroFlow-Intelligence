services:
  - type: web
    name: aeroflow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aeroflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://aeroflow-ui.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_ISSUER
        value: aeroflow-api
      - key: JWT_AUDIENCE
        value: aeroflow-client
      - key: RUN_BACKGROUND_WORKERS
        value: "false"
      - key: RUN_PREDICTIONS_ON_STARTUP
        value: "false"
      - key: SEED_ADMIN
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERATIONS_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: AEROFLOW_ML_DIR
        value: /app/ML_Models
      - key: ML_DIR
        value: /app/ML_Models
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "300"

  - type: web
    name: aeroflow-ui
    runtime: static
    rootDir: Frontend/aeroflow-ui
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://aeroflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aeroflow-db
    plan: free
    region: oregon
    databaseName: aeroflow
    user: aeroflow
    postgresMajorVersion: "15"
